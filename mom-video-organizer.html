<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mom Video Organizer</title>
  <link rel="icon" href="queen-nur-logo.png">
  <link rel="apple-touch-icon" href="queen-nur-logo.png">
  <style>
    :root {
      --ink: #2f2435;
      --muted: #7a667f;
      --line: #ead9ec;
      --paper: #fff8fd;
      --soft: #fbedf8;
      --mint: #f6d8ef;
      --green: #8b2f93;
      --green-strong: #5f176a;
      --blue: #d84f9f;
      --coral: #bf3d71;
      --yellow: #d7a63a;
      --gold: #d7a63a;
      --gold-soft: #fff0bd;
      --shadow: 0 16px 40px rgba(88, 42, 96, .12);
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(246, 216, 239, .95), rgba(255, 248, 253, .98) 43%, rgba(255, 240, 189, .55)),
        var(--paper);
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      padding: 22px clamp(16px, 3vw, 36px) 18px;
      border-bottom: 1px solid rgba(215, 166, 58, .36);
      background: rgba(255, 253, 248, .82);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: center;
      max-width: 1280px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.4vw, 2.45rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .brand {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 14px;
      align-items: center;
      min-width: 0;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      background: white;
      border: 1px solid rgba(215, 166, 58, .52);
      box-shadow: 0 8px 22px rgba(105, 46, 137, .16), 0 0 0 3px rgba(215, 166, 58, .12);
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: .98rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .button {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      padding: 0 14px;
      color: white;
      background: linear-gradient(135deg, var(--green), #b83c9b 62%, var(--gold));
      box-shadow: 0 8px 18px rgba(139, 47, 147, .22), 0 0 0 1px rgba(215, 166, 58, .18) inset;
      white-space: nowrap;
    }

    .button.secondary {
      color: var(--green-strong);
      background: linear-gradient(180deg, white, #fff8e8);
      border: 1px solid rgba(215, 166, 58, .44);
      box-shadow: none;
    }

    .icon {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex: 0 0 auto;
    }

    input[type="file"] {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }

    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 24px clamp(16px, 3vw, 36px) 36px;
      display: grid;
      grid-template-columns: minmax(250px, 300px) 1fr;
      gap: 22px;
      align-items: start;
    }

    aside {
      position: sticky;
      top: 104px;
      display: grid;
      gap: 14px;
    }

    .panel {
      background: rgba(255, 255, 255, .8);
      border: 1px solid rgba(215, 166, 58, .28);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      overflow: hidden;
      background: var(--line);
    }

    .stat {
      background: white;
      min-height: 92px;
      padding: 16px;
      display: grid;
      align-content: center;
      gap: 4px;
    }

    .stat strong {
      font-size: 1.7rem;
      line-height: 1;
      color: var(--green-strong);
      text-shadow: 0 1px 0 rgba(255, 240, 189, .7);
    }

    .stat span {
      color: var(--muted);
      font-size: .88rem;
    }

    .filters {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    input, select, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: white;
      color: var(--ink);
      outline: none;
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(139, 47, 147, .14);
    }

    .dropzone {
      border: 2px dashed rgba(139, 47, 147, .3);
      background: rgba(246, 216, 239, .68);
      padding: 18px;
      display: grid;
      place-items: center;
      text-align: center;
      min-height: 118px;
      transition: .18s ease;
    }

    .dropzone.dragging {
      border-color: var(--gold);
      background: var(--mint);
      transform: translateY(-1px);
    }

    .drop-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .drop-sub {
      color: var(--muted);
      font-size: .9rem;
    }

    .library {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
    }

    .segmented {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(76px, 1fr));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      overflow: hidden;
      min-height: 42px;
    }

    .segment {
      color: var(--muted);
      background: white;
      padding: 0 12px;
      border-left: 1px solid var(--line);
      white-space: nowrap;
    }

    .segment:first-child { border-left: 0; }
    .segment.active {
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--gold));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .video-card {
      background: white;
      border: 1px solid rgba(37, 48, 43, .1);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(37, 48, 43, .09);
      display: grid;
      min-width: 0;
    }

    .thumb {
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #f6d8ef, #fff0bd);
      position: relative;
      overflow: hidden;
    }

    .thumb img, .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-row {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: end;
    }

    .pill {
      max-width: 100%;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--ink);
      background: rgba(255, 255, 255, .88);
      font-size: .78rem;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(0, 0, 0, .12);
    }

    .posted {
      color: white;
      background: rgba(139, 47, 147, .92);
      border: 1px solid rgba(255, 240, 189, .55);
    }

    .card-body {
      padding: 13px;
      display: grid;
      gap: 10px;
    }

    .card-title {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      color: var(--muted);
      font-size: .86rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 26px;
    }

    .tag {
      border-radius: 999px;
      padding: 5px 8px;
      background: var(--soft);
      color: var(--green-strong);
      border: 1px solid rgba(215, 166, 58, .26);
      font-size: .78rem;
      font-weight: 700;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .icon-button {
      min-height: 38px;
      display: inline-grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }

    .icon-button.danger {
      color: var(--coral);
    }

    .list .grid {
      grid-template-columns: 1fr;
    }

    .list .video-card {
      grid-template-columns: minmax(190px, 280px) 1fr;
    }

    .empty {
      min-height: 360px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 28px;
      background:
        radial-gradient(circle at 20% 20%, rgba(215, 166, 58, .22), transparent 32%),
        radial-gradient(circle at 85% 24%, rgba(139, 47, 147, .15), transparent 34%),
        white;
      border: 1px solid rgba(37, 48, 43, .1);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .empty strong {
      display: block;
      font-size: 1.25rem;
      margin-bottom: 8px;
    }

    .empty p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    dialog {
      width: min(680px, calc(100vw - 24px));
      border: 1px solid rgba(37, 48, 43, .14);
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 24px 70px rgba(37, 48, 43, .24);
      background: white;
    }

    dialog::backdrop {
      background: rgba(37, 48, 43, .36);
      backdrop-filter: blur(3px);
    }

    .modal-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h2 {
      margin: 0;
      font-size: 1.12rem;
    }

    .modal-body {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .full { grid-column: 1 / -1; }

    .checkline {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: .95rem;
      font-weight: 700;
      text-transform: none;
    }

    .checkline input {
      width: 18px;
      min-height: 18px;
      accent-color: var(--green);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 0 18px 18px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      max-width: calc(100vw - 24px);
      background: var(--ink);
      color: white;
      border-radius: 8px;
      padding: 11px 14px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: .18s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @media (max-width: 900px) {
      .topbar, main, .toolbar {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: stretch;
      }

      .button, .actions label.button {
        flex: 1;
      }

      aside {
        position: static;
      }
    }

    @media (max-width: 640px) {
      header {
        position: static;
      }

      main {
        padding-top: 16px;
      }

      .stats, .form-grid, .list .video-card {
        grid-template-columns: 1fr;
      }

      .segmented {
        width: 100%;
      }

      .card-actions {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .brand {
        grid-template-columns: 52px 1fr;
      }

      .brand-logo {
        width: 52px;
        height: 52px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="topbar">
        <div class="brand">
          <img class="brand-logo" src="queen-nur-logo.png" alt="Queen Nur logo">
          <div>
          <h1>Mom Video Organizer</h1>
          <p class="subtitle">Family clips, posting ideas, and Facebook memories in one tidy place.</p>
          </div>
        </div>
        <div class="actions">
          <label class="button" for="videoInput">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Add Videos
          </label>
          <input id="videoInput" type="file" accept="video/*" multiple>
          <button class="button secondary" id="exportBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
            Export List
          </button>
        </div>
      </div>
    </header>

    <main>
      <aside>
        <section class="panel stats" aria-label="Library totals">
          <div class="stat"><strong id="totalCount">0</strong><span>Videos</span></div>
          <div class="stat"><strong id="postedCount">0</strong><span>Posted</span></div>
          <div class="stat"><strong id="draftCount">0</strong><span>Ready</span></div>
          <div class="stat"><strong id="eventCount">0</strong><span>Events</span></div>
        </section>

        <section class="panel filters">
          <label>
            Search
            <input id="searchInput" type="search" placeholder="Title, tag, event">
          </label>
          <label>
            Event
            <select id="eventFilter">
              <option value="">All events</option>
            </select>
          </label>
          <label>
            Status
            <select id="statusFilter">
              <option value="">All videos</option>
              <option value="ready">Ready to post</option>
              <option value="posted">Posted</option>
            </select>
          </label>
          <label>
            Sort
            <select id="sortSelect">
              <option value="newest">Newest first</option>
              <option value="oldest">Oldest first</option>
              <option value="title">Title A to Z</option>
              <option value="event">Event A to Z</option>
            </select>
          </label>
        </section>

        <section class="panel dropzone" id="dropzone">
          <div>
            <div class="drop-title">Drop videos here</div>
            <div class="drop-sub">MP4, MOV, WEBM, and phone videos</div>
          </div>
        </section>
      </aside>

      <section class="library" id="library">
        <div class="toolbar">
          <input id="quickTitle" type="text" placeholder="New event name">
          <button class="button secondary" id="applyEventBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
            Use Event
          </button>
          <div class="segmented" aria-label="View">
            <button class="segment active" id="gridBtn" type="button">Grid</button>
            <button class="segment" id="listBtn" type="button">List</button>
          </div>
        </div>
        <div id="content"></div>
      </section>
    </main>
  </div>

  <dialog id="editDialog">
    <form method="dialog" id="editForm">
      <div class="modal-head">
        <h2>Edit Video</h2>
        <button class="icon-button" value="cancel" type="submit" title="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="form-grid">
          <label>
            Title
            <input id="editTitle" required>
          </label>
          <label>
            Event
            <input id="editEvent" placeholder="Birthday, cooking, travel">
          </label>
          <label>
            Date
            <input id="editDate" type="date">
          </label>
          <label>
            Privacy
            <select id="editPrivacy">
              <option>Friends</option>
              <option>Family</option>
              <option>Public</option>
              <option>Only me</option>
            </select>
          </label>
          <label class="full">
            Tags
            <input id="editTags" placeholder="family, food, funny">
          </label>
          <label class="full">
            Caption
            <textarea id="editCaption"></textarea>
          </label>
          <label class="full checkline">
            <input id="editPosted" type="checkbox">
            Posted on Facebook
          </label>
        </div>
      </div>
      <div class="modal-actions">
        <button class="button secondary" value="cancel" type="submit">Cancel</button>
        <button class="button" id="saveEditBtn" value="default" type="button">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const DB_NAME = 'mom-video-organizer';
    const STORE = 'videos';
    const els = {
      input: document.querySelector('#videoInput'),
      content: document.querySelector('#content'),
      total: document.querySelector('#totalCount'),
      posted: document.querySelector('#postedCount'),
      draft: document.querySelector('#draftCount'),
      events: document.querySelector('#eventCount'),
      search: document.querySelector('#searchInput'),
      eventFilter: document.querySelector('#eventFilter'),
      statusFilter: document.querySelector('#statusFilter'),
      sort: document.querySelector('#sortSelect'),
      dropzone: document.querySelector('#dropzone'),
      exportBtn: document.querySelector('#exportBtn'),
      quickTitle: document.querySelector('#quickTitle'),
      applyEvent: document.querySelector('#applyEventBtn'),
      library: document.querySelector('#library'),
      gridBtn: document.querySelector('#gridBtn'),
      listBtn: document.querySelector('#listBtn'),
      dialog: document.querySelector('#editDialog'),
      editId: document.querySelector('#editId'),
      editTitle: document.querySelector('#editTitle'),
      editEvent: document.querySelector('#editEvent'),
      editDate: document.querySelector('#editDate'),
      editPrivacy: document.querySelector('#editPrivacy'),
      editTags: document.querySelector('#editTags'),
      editCaption: document.querySelector('#editCaption'),
      editPosted: document.querySelector('#editPosted'),
      saveEdit: document.querySelector('#saveEditBtn'),
      toast: document.querySelector('#toast')
    };
    let db;
    let videos = [];
    let view = 'grid';

    function openDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => request.result.createObjectStore(STORE, { keyPath: 'id' });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function tx(mode = 'readonly') {
      return db.transaction(STORE, mode).objectStore(STORE);
    }

    function getAllVideos() {
      return new Promise((resolve, reject) => {
        const request = tx().getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function putVideo(video) {
      return new Promise((resolve, reject) => {
        const request = tx('readwrite').put(video);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function deleteVideo(id) {
      return new Promise((resolve, reject) => {
        const request = tx('readwrite').delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    function titleFromFile(name) {
      return name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim() || 'Untitled video';
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    function formatDate(value) {
      if (!value) return 'No date';
      const date = new Date(`${value}T00:00:00`);
      return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function durationLabel(seconds) {
      if (!Number.isFinite(seconds) || seconds <= 0) return 'Video';
      const mins = Math.floor(seconds / 60);
      const secs = Math.round(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function suggestCaption(title, event) {
      const base = event ? `${event} memory` : 'sweet memory';
      return `Sharing this ${base}: ${title}`;
    }

    function generateThumbnail(file) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.src = url;
        video.onloadeddata = () => {
          try {
            if (!video.duration || video.duration < .2) capture();
            else video.currentTime = Math.min(1, video.duration);
          } catch {
            capture();
          }
        };
        video.onseeked = capture;
        video.onerror = () => {
          URL.revokeObjectURL(url);
          resolve({ thumb: '', duration: 0 });
        };
        function capture() {
          const canvas = document.createElement('canvas');
          canvas.width = 640;
          canvas.height = 360;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#f6d8ef';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const ratio = Math.max(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
          const width = video.videoWidth * ratio;
          const height = video.videoHeight * ratio;
          ctx.drawImage(video, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
          const thumb = canvas.toDataURL('image/jpeg', .82);
          const duration = video.duration || 0;
          URL.revokeObjectURL(url);
          resolve({ thumb, duration });
        }
      });
    }

    async function handleFiles(files) {
      const videoFiles = Array.from(files).filter(file => file.type.startsWith('video/'));
      if (!videoFiles.length) return showToast('No video files found.');
      showToast(`Adding ${videoFiles.length} video${videoFiles.length > 1 ? 's' : ''}...`);
      for (const file of videoFiles) {
        const title = titleFromFile(file.name);
        const { thumb, duration } = await generateThumbnail(file);
        await putVideo({
          id: crypto.randomUUID(),
          title,
          event: els.quickTitle.value.trim(),
          date: today(),
          privacy: 'Friends',
          tags: defaultTags(title, els.quickTitle.value),
          caption: suggestCaption(title, els.quickTitle.value.trim()),
          posted: false,
          createdAt: Date.now(),
          duration,
          fileName: file.name,
          type: file.type,
          size: file.size,
          thumb,
          blob: file
        });
      }
      await refresh();
      showToast('Videos added.');
    }

    function defaultTags(title, event) {
      const words = `${title} ${event}`.toLowerCase();
      const tags = ['family'];
      if (/cook|food|kitchen|eat|recipe/.test(words)) tags.push('food');
      if (/birthday|party|celebration/.test(words)) tags.push('birthday');
      if (/travel|beach|trip|vacation/.test(words)) tags.push('travel');
      if (/fun|laugh|dance|sing/.test(words)) tags.push('fun');
      return [...new Set(tags)];
    }

    function filteredVideos() {
      const q = els.search.value.trim().toLowerCase();
      const eventValue = els.eventFilter.value;
      const status = els.statusFilter.value;
      const sort = els.sort.value;
      const result = videos.filter(video => {
        const haystack = [video.title, video.event, video.caption, ...(video.tags || [])].join(' ').toLowerCase();
        const matchesText = !q || haystack.includes(q);
        const matchesEvent = !eventValue || video.event === eventValue;
        const matchesStatus = !status || (status === 'posted' ? video.posted : !video.posted);
        return matchesText && matchesEvent && matchesStatus;
      });
      result.sort((a, b) => {
        if (sort === 'oldest') return a.createdAt - b.createdAt;
        if (sort === 'title') return a.title.localeCompare(b.title);
        if (sort === 'event') return (a.event || 'zzz').localeCompare(b.event || 'zzz');
        return b.createdAt - a.createdAt;
      });
      return result;
    }

    function renderStats() {
      const events = new Set(videos.map(v => v.event).filter(Boolean));
      els.total.textContent = videos.length;
      els.posted.textContent = videos.filter(v => v.posted).length;
      els.draft.textContent = videos.filter(v => !v.posted).length;
      els.events.textContent = events.size;
      const current = els.eventFilter.value;
      els.eventFilter.innerHTML = '<option value="">All events</option>';
      [...events].sort().forEach(event => {
        const option = document.createElement('option');
        option.value = event;
        option.textContent = event;
        els.eventFilter.append(option);
      });
      els.eventFilter.value = current;
    }

    function render() {
      renderStats();
      const list = filteredVideos();
      els.library.classList.toggle('list', view === 'list');
      els.gridBtn.classList.toggle('active', view === 'grid');
      els.listBtn.classList.toggle('active', view === 'list');
      if (!videos.length) {
        els.content.innerHTML = `
          <div class="empty">
            <div>
              <strong>Start her video library</strong>
              <p>Add phone clips, label the event, then keep track of what is ready for Facebook.</p>
              <label class="button" for="videoInput">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Add Videos
              </label>
            </div>
          </div>`;
        return;
      }
      if (!list.length) {
        els.content.innerHTML = '<div class="empty"><div><strong>No matches</strong><p>Try a different search, event, or status.</p></div></div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'grid';
      list.forEach(video => grid.append(videoCard(video)));
      els.content.replaceChildren(grid);
    }

    function videoCard(video) {
      const card = document.createElement('article');
      card.className = 'video-card';
      const tags = (video.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');
      card.innerHTML = `
        <div class="thumb">
          ${video.thumb ? `<img src="${video.thumb}" alt="">` : ''}
          <div class="badge-row">
            <span class="pill">${escapeHtml(durationLabel(video.duration))}</span>
            ${video.posted ? '<span class="pill posted">Posted</span>' : '<span class="pill">Ready</span>'}
          </div>
        </div>
        <div class="card-body">
          <h3 class="card-title">${escapeHtml(video.title)}</h3>
          <div class="meta">
            <span>${escapeHtml(video.event || 'No event')}</span>
            <span>${formatDate(video.date)}</span>
            <span>${escapeHtml(video.privacy || 'Friends')}</span>
          </div>
          <div class="tags">${tags || '<span class="tag">family</span>'}</div>
          <div class="card-actions">
            <button class="icon-button" data-action="play" title="Play video" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 9-14 9V3z"/></svg>
            </button>
            <button class="icon-button" data-action="edit" title="Edit details" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
            </button>
            <button class="icon-button danger" data-action="delete" title="Delete video" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </button>
          </div>
        </div>`;
      card.querySelector('[data-action="play"]').addEventListener('click', () => playVideo(video));
      card.querySelector('[data-action="edit"]').addEventListener('click', () => openEditor(video));
      card.querySelector('[data-action="delete"]').addEventListener('click', () => removeVideo(video));
      return card;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function playVideo(video) {
      const url = URL.createObjectURL(video.blob);
      const dialog = document.createElement('dialog');
      dialog.innerHTML = `
        <div class="modal-head">
          <h2>${escapeHtml(video.title)}</h2>
          <button class="icon-button" type="button" title="Close">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </button>
        </div>
        <video src="${url}" controls autoplay style="display:block;width:100%;max-height:72vh;background:#000"></video>
        <div class="modal-body"><textarea readonly>${escapeHtml(video.caption || '')}</textarea></div>`;
      document.body.append(dialog);
      dialog.querySelector('button').addEventListener('click', () => dialog.close());
      dialog.addEventListener('close', () => {
        URL.revokeObjectURL(url);
        dialog.remove();
      });
      dialog.showModal();
    }

    function openEditor(video) {
      els.editId.value = video.id;
      els.editTitle.value = video.title;
      els.editEvent.value = video.event || '';
      els.editDate.value = video.date || '';
      els.editPrivacy.value = video.privacy || 'Friends';
      els.editTags.value = (video.tags || []).join(', ');
      els.editCaption.value = video.caption || '';
      els.editPosted.checked = Boolean(video.posted);
      els.dialog.showModal();
    }

    async function saveEdit() {
      const video = videos.find(item => item.id === els.editId.value);
      if (!video) return;
      video.title = els.editTitle.value.trim() || 'Untitled video';
      video.event = els.editEvent.value.trim();
      video.date = els.editDate.value;
      video.privacy = els.editPrivacy.value;
      video.tags = els.editTags.value.split(',').map(tag => tag.trim()).filter(Boolean);
      video.caption = els.editCaption.value.trim();
      video.posted = els.editPosted.checked;
      await putVideo(video);
      els.dialog.close();
      await refresh();
      showToast('Video updated.');
    }

    async function removeVideo(video) {
      if (!confirm(`Delete "${video.title}" from this organizer?`)) return;
      await deleteVideo(video.id);
      await refresh();
      showToast('Video deleted.');
    }

    function exportList() {
      const data = videos.map(({ blob, thumb, ...video }) => ({
        ...video,
        tags: video.tags || [],
        sizeMb: Math.round((video.size || 0) / 1024 / 1024 * 10) / 10
      }));
      const file = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(file);
      link.download = 'mom-video-list.json';
      link.click();
      URL.revokeObjectURL(link.href);
    }

    async function refresh() {
      videos = await getAllVideos();
      render();
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove('show'), 2200);
    }

    els.input.addEventListener('change', event => handleFiles(event.target.files));
    els.search.addEventListener('input', render);
    els.eventFilter.addEventListener('change', render);
    els.statusFilter.addEventListener('change', render);
    els.sort.addEventListener('change', render);
    els.exportBtn.addEventListener('click', exportList);
    els.saveEdit.addEventListener('click', saveEdit);
    els.gridBtn.addEventListener('click', () => { view = 'grid'; render(); });
    els.listBtn.addEventListener('click', () => { view = 'list'; render(); });
    els.applyEvent.addEventListener('click', () => {
      if (!els.quickTitle.value.trim()) return showToast('Add an event name first.');
      showToast(`Event set to "${els.quickTitle.value.trim()}".`);
    });

    ['dragenter', 'dragover'].forEach(type => {
      els.dropzone.addEventListener(type, event => {
        event.preventDefault();
        els.dropzone.classList.add('dragging');
      });
    });
    ['dragleave', 'drop'].forEach(type => {
      els.dropzone.addEventListener(type, event => {
        event.preventDefault();
        els.dropzone.classList.remove('dragging');
      });
    });
    els.dropzone.addEventListener('drop', event => handleFiles(event.dataTransfer.files));

    openDb().then(database => {
      db = database;
      refresh();
    }).catch(() => {
      els.content.innerHTML = '<div class="empty"><div><strong>Storage unavailable</strong><p>Please open this in a modern browser.</p></div></div>';
    });
  </script>
</body>
</html>
